name: Biweekly SEO/GEO Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/seo-audit.js'
      - 'scripts/seo-audit.test.js'
      - 'scripts/seo-audit.config.json'
      - '.github/workflows/seo-audit.yml'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/**/layout.tsx'
      - 'app/**/page.tsx'
      - 'lib/seo.ts'
      - 'public/robots.txt'
      - 'next.config.js'
      - 'firebase.json'
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

jobs:
  route-policy-fixtures:
    name: Deterministic SEO route policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Run local SEO fixtures
        run: node --test scripts/seo-audit.test.js

      - name: Validate configured route policies
        run: |
          node -e "const { validateRoutePolicies, validateRedirectChecks } = require('./scripts/seo-audit'); const config = require('./scripts/seo-audit.config.json'); validateRoutePolicies(config.routePolicies); validateRedirectChecks(config.redirectChecks, new URL(config.siteUrl).origin);"

  seo-audit:
    name: Live public SEO audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEO_AUDIT_ANCHOR_MONDAY: '2026-06-29'
    steps:
      - name: Check biweekly cadence
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          anchor_seconds="$(date -u -d "$SEO_AUDIT_ANCHOR_MONDAY" +%s)"
          today="$(date -u +%Y-%m-%d)"
          today_seconds="$(date -u -d "$today" +%s)"
          days_since_anchor=$(( (today_seconds - anchor_seconds) / 86400 ))

          if [ "$days_since_anchor" -ge 0 ] && [ $(( days_since_anchor % 14 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=biweekly audit window" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=off-week skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip off-week
        if: steps.cadence.outputs.run != 'true'
        run: |
          echo "Skipping SEO/GEO audit: ${{ steps.cadence.outputs.reason }}"

      - name: Checkout
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Verify selected npm before cache restore
        if: steps.cadence.outputs.run == 'true'
        run: |
          mkdir -m 0700 "$RUNNER_TEMP/taco-toolcache"
          node scripts/toolchain/npm-runtime.cjs prepare --cache-parent "$RUNNER_TEMP/taco-toolcache" > "$RUNNER_TEMP/taco-npm-identity.json"
          node -e 'const fs=require("node:fs");const i=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/taco-npm-identity.json"));fs.appendFileSync(process.env.GITHUB_ENV,"TACO_NPM_CACHE_PARENT="+i.cacheParent+"\nTACO_NPM_CONTENT_CACHE="+i.npmContentCache+"\nTACO_NPM_RUNTIME_KEY="+i.cacheKey+"\n")'

      - name: Restore private npm content cache
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.TACO_NPM_CONTENT_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-taco-npm-v2-${{ env.TACO_NPM_RUNTIME_KEY }}

      - name: Reverify selected npm and remove disposable original
        if: steps.cadence.outputs.run == 'true'
        run: |
          node scripts/toolchain/npm-runtime.cjs identity --cache-parent "$TACO_NPM_CACHE_PARENT" > "$RUNNER_TEMP/taco-npm-identity.json"
          taco_node_bin="$(node -p 'require("node:path").dirname(require("node:fs").realpathSync(process.execPath))')"
          test -d "$taco_node_bin/../lib/node_modules/npm"
          sudo rm -rf "$taco_node_bin/../lib/node_modules/npm" "$taco_node_bin/npm" "$taco_node_bin/npx"
          node -e 'const fs=require("node:fs");const path=require("node:path");const i=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/taco-npm-identity.json"));const bin=path.dirname(i.nodeRealpath);fs.symlinkSync(i.npmShimRealpath,path.join(bin,"npm"));fs.symlinkSync(i.npxShimRealpath,path.join(bin,"npx"))'
          test ! -e "$taco_node_bin/../lib/node_modules/npm"
          test "$(npm --version)" = "12.1.0"
          test "$(npx --version)" = "12.1.0"
          npm cache verify

      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: |
          sha256sum package.json package-lock.json .npmrc > "$RUNNER_TEMP/taco-install-inputs.sha256"
          npm ci --no-audit --no-fund --foreground-scripts
          sha256sum --check "$RUNNER_TEMP/taco-install-inputs.sha256"

      - name: Run SEO/GEO audit
        if: steps.cadence.outputs.run == 'true'
        run: npm run seo:audit:ci -- --out-dir seo-audit-artifacts

      - name: Upload audit artifacts
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seo-geo-audit
          path: |
            seo-audit-artifacts/seo-audit-summary.md
            seo-audit-artifacts/seo-audit-results.json
          if-no-files-found: error
